name: bare-test

on:
  push:
  pull_request:
    branches: [ main ]

defaults:
  run:
    shell: bash

jobs:
  test-pyzmq:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14.0-rc.2"
            os: windows-2025
          - python-version: "3.13"
            os: windows-2025
          - python-version: "3.14.0-rc.2"
            os: ubuntu-24.04
          - python-version: "3.14.0-rc.2"
            os: macos-15
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: test
      run: |
        python ./test.py
      env:
        PYTHONDEVMODE: "1"
        PYTHONWARNINGS: "d"
        PYTHONFAULTHANDLER: "1"
